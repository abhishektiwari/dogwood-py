[build-system]
requires = ["maturin>=1.7,<2", "setuptools-scm[toml]>=8"]
build-backend = "maturin"

[project]
name = "dogwood-py"
authors = [
  { name = "Abhishek Tiwari", email = "abhishek@abhishek-tiwari.com" },
]
dynamic = ["version"]
description = "Python SDK and reference-compatible interpreter surface for Dogwood policies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
  "dogwood",
  "policy",
  "authorization",
  "cedar",
  "temporal-policy",
  "pyo3",
  "maturin",
  "fastapi",
  "strands-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/abhishektiwari/dogwood-py"
Documentation = "https://dogwood-py.abhishek-tiwari.com/"
"Bug Reports" = "https://github.com/abhishektiwari/dogwood-py/issues"
Repository = "https://github.com/abhishektiwari/dogwood-py"
Source = "https://github.com/abhishektiwari/dogwood-py"

[project.scripts]
dogwood = "dogwood.cli:main"
dogwood-py = "dogwood.cli:main"

[project.optional-dependencies]
dev = [
  "maturin>=1.7,<2",
  "pytest>=8",
  "setuptools-scm[toml]>=8",
  "sphinx>=8",
  "sphinx-autobuild>=2024.10",
  "sphinx-book-theme>=1.1",
  "sphinx-copybutton>=0.5",
  "sphinx-sitemap>=2.6",
  "twine>=5",
]
examples = [
  "fastapi>=0.115",
  "httpx2>=0.28",
  "uvicorn[standard]>=0.30",
]
strands = [
  "strands-agents>=1",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "dogwood._dogwood_native"
python-source = "src"
features = ["pyo3/extension-module"]
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "NOTICE", format = "sdist" },
  { path = "src/dogwood/_version.py", format = "wheel" },
  { path = "src/dogwood/_version.py", format = "sdist" },
  { path = "examples/__init__.py", format = "wheel" },
  { path = "examples/api_usage.py", format = "wheel" },
  { path = "examples/cli/*.py", format = "wheel" },
  { path = "examples/cli/*", format = "wheel" },
  { path = "examples/fastapi_simple/*.py", format = "wheel" },
  { path = "examples/fastapi_simple/*.dw", format = "wheel" },
  { path = "examples/fastapi_simple/*.dwschema", format = "wheel" },
  { path = "examples/fastapi_simple/*.cedarschema", format = "wheel" },
  { path = "examples/fastapi_simple/README.md", format = "wheel" },
  { path = "examples/shopping_agent_policies/*.dw", format = "wheel" },
  { path = "examples/shopping_agent_policies/*.dwschema", format = "wheel" },
  { path = "examples/shopping_agent_policies/*.cedarschema", format = "wheel" },
  { path = "examples/shopping_agent_policies/*.json", format = "wheel" },
  { path = "examples/shopping_agent_policies/README.md", format = "wheel" },
  { path = "examples/strands_shopping_agent/*.py", format = "wheel" },
  { path = "examples/strands_shopping_agent/README.md", format = "wheel" },
]

[tool.setuptools_scm]
write_to = "src/dogwood/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
