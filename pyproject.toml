[build-system]
requires = ["maturin>=1.7,<2", "setuptools-scm[toml]>=8"]
build-backend = "maturin"

[project]
name = "dogwood-py"
dynamic = ["version"]
description = "Python SDK and reference-compatible interpreter surface for Dogwood policies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dogwood Python contributors" }]
keywords = ["dogwood", "policy", "authorization", "cedar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.scripts]
dogwood-py = "dogwood.cli:main"

[project.optional-dependencies]
examples = [
  "fastapi>=0.115",
  "httpx2>=0.28",
  "uvicorn[standard]>=0.30",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "dogwood._dogwood_native"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.setuptools_scm]
write_to = "src/dogwood/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
