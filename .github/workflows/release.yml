name: Build and Release

on:
  pull_request:
    branches: [ main ]
  workflow_run:
    workflows: [ Tests ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-system-ca

jobs:
  generate-version:
    name: Generate version
    runs-on: ubuntu-latest
    # Skip if Tests workflow failed.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      version_tag: ${{ steps.generate_version.outputs.version_tag }}
      github_tag: ${{ steps.generate_version.outputs.github_tag }}
      is_prerelease: ${{ steps.generate_version.outputs.is_prerelease }}
      pr_number: ${{ github.event.number }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Generate version for PR
        if: github.event_name == 'pull_request'
        id: generate_pr_version
        shell: bash
        run: |
          BASE_VERSION=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 | sed 's/^v//')
          if [[ -z "$BASE_VERSION" ]]; then
            BASE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["setuptools_scm"]["fallback_version"])')
          fi

          VERSION="${BASE_VERSION}.dev${GITHUB_RUN_NUMBER}"
          VERSION_TAG="v${VERSION}"
          GITHUB_TAG="v${BASE_VERSION}-pr${{ github.event.number }}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          {
            echo "version=${VERSION}"
            echo "version_tag=${VERSION_TAG}"
            echo "github_tag=${GITHUB_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate version for release
        if: github.event_name != 'pull_request'
        id: generate_release_version
        uses: paulhatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3 # v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true

      - name: Set version outputs
        id: generate_version
        shell: bash
        env:
          PR_VERSION: ${{ steps.generate_pr_version.outputs.version }}
          PR_VERSION_TAG: ${{ steps.generate_pr_version.outputs.version_tag }}
          PR_GITHUB_TAG: ${{ steps.generate_pr_version.outputs.github_tag }}
          RELEASE_VERSION: ${{ steps.generate_release_version.outputs.version }}
          RELEASE_VERSION_TAG: ${{ steps.generate_release_version.outputs.version_tag }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="$PR_VERSION"
            VERSION_TAG="$PR_VERSION_TAG"
            GITHUB_TAG="$PR_GITHUB_TAG"
            IS_PRERELEASE="true"
          else
            VERSION="$RELEASE_VERSION"
            VERSION_TAG="$RELEASE_VERSION_TAG"
            GITHUB_TAG="$RELEASE_VERSION_TAG"
            IS_PRERELEASE="false"
          fi

          {
            echo "version=${VERSION}"
            echo "version_tag=${VERSION_TAG}"
            echo "github_tag=${GITHUB_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

  build-sdist:
    name: Build source distribution
    needs: generate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply generated package version
        shell: bash
        env:
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          text = re.sub(
              r'(?m)^version = "[^"]+"$',
              f'version = "{os.environ["VERSION"]}"',
              text,
              count=1,
          )
          text = re.sub(
              r'(?m)^dynamic = \["version"\]$',
              f'version = "{os.environ["VERSION"]}"',
              text,
              count=1,
          )
          path.write_text(text)
          PY

      - name: Write generated version file
        shell: bash
        env:
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          Path("src/dogwood/_version.py").write_text(
              "# file generated during release builds\n"
              f'__version__ = version = "{version}"\n'
              f'__version_tuple__ = version_tuple = tuple("{version}".replace("-", ".").split("."))\n'
          )
          PY

      - name: Build sdist
        run: make setup sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dogwood-py-sdist
          path: dist/*
          if-no-files-found: error

  build-wheels:
    name: Build wheels ${{ matrix.platform.target }}
    needs: generate-version
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Apply generated package version
        shell: bash
        env:
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          text = re.sub(
              r'(?m)^version = "[^"]+"$',
              f'version = "{os.environ["VERSION"]}"',
              text,
              count=1,
          )
          text = re.sub(
              r'(?m)^dynamic = \["version"\]$',
              f'version = "{os.environ["VERSION"]}"',
              text,
              count=1,
          )
          path.write_text(text)
          PY

      - name: Write generated version file
        shell: bash
        env:
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          Path("src/dogwood/_version.py").write_text(
              "# file generated during release builds\n"
              f'__version__ = version = "{version}"\n'
              f'__version_tuple__ = version_tuple = tuple("{version}".replace("-", ".").split("."))\n'
          )
          PY

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist --find-interpreter
          target: ${{ matrix.platform.target }}
          sccache: true
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dogwood-py-wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [generate-version, build-sdist, build-wheels]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TAG: ${{ needs.generate-version.outputs.github_tag }}
          VERSION: ${{ needs.generate-version.outputs.version }}
          IS_PRERELEASE: ${{ needs.generate-version.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$GITHUB_TAG" dist/* \
            --title "${GITHUB_TAG}" \
            --notes "Automated dogwood-py release.

          Version: ${VERSION}
          Tag: ${GITHUB_TAG}
          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}
          Prerelease: ${IS_PRERELEASE}" \
            $PRERELEASE_FLAG

  publish-pypi:
    name: Publish to PyPI
    needs: [generate-version, build-sdist, build-wheels]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    environment: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

      - name: Comment on PR
        if: github.event_name == 'pull_request' && needs.generate-version.outputs.is_prerelease == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.generate-version.outputs.pr_number }}
          GITHUB_TAG: ${{ needs.generate-version.outputs.github_tag }}
          VERSION: ${{ needs.generate-version.outputs.version }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            if (!Number.isInteger(prNumber)) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }

            const tag = process.env.GITHUB_TAG;
            const version = process.env.VERSION;
            const repo = process.env.REPO;
            const marker = "<!-- dogwood-py-prerelease -->";
            const releaseUrl = `https://github.com/${repo}/releases/tag/${tag}`;
            const pypiUrl = `https://pypi.org/project/dogwood-py/${version}/`;

            const body = [
              marker,
              "## Pre-release Ready",
              "",
              `A pre-release has been published for this PR: **dogwood-py ${version}**`,
              "",
              "### Quick Test",
              "",
              "Install the PR prerelease from PyPI:",
              "",
              "```bash",
              `pip install --pre dogwood-py==${version}`,
              "```",
              "",
              "Or download release artifacts from GitHub:",
              "",
              "```bash",
              `gh release download ${tag} --repo ${repo}`,
              "```",
              "",
              "### Links",
              "",
              `- PyPI: ${pypiUrl}`,
              `- GitHub release: ${releaseUrl}`,
              "",
              `Version metadata: \`${version}\``,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user.type === "Bot" && (comment.body || "").includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
