name: Build and Release

on:
  pull_request:
    branches: [ main ]
  workflow_run:
    workflows: [ Tests ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-version:
    name: Generate version
    runs-on: ubuntu-latest
    # Skip if Tests workflow failed.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      version_tag: ${{ steps.generate_version.outputs.version_tag }}
      github_tag: ${{ steps.generate_version.outputs.github_tag }}
      is_prerelease: ${{ steps.generate_version.outputs.is_prerelease }}
      pr_number: ${{ github.event.number }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate version and tags
        id: generate_version
        shell: bash
        run: |
          BASE_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="${BASE_VERSION}.dev${GITHUB_RUN_NUMBER}"
            VERSION_TAG="v${VERSION}"
            GITHUB_TAG="v${BASE_VERSION}-pr${{ github.event.number }}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            IS_PRERELEASE="true"
          else
            VERSION="${BASE_VERSION}"
            VERSION_TAG="v${BASE_VERSION}"
            GITHUB_TAG="v${BASE_VERSION}"
            IS_PRERELEASE="false"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "github_tag=${GITHUB_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

  build-sdist:
    name: Build source distribution
    needs: generate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build sdist
        run: make setup sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogwood-py-sdist
          path: dist/*
          if-no-files-found: error

  build-wheels:
    name: Build wheels ${{ matrix.platform.target }}
    needs: generate-version
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter
          target: ${{ matrix.platform.target }}
          sccache: true
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogwood-py-wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [generate-version, build-sdist, build-wheels]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TAG: ${{ needs.generate-version.outputs.github_tag }}
          VERSION: ${{ needs.generate-version.outputs.version }}
          IS_PRERELEASE: ${{ needs.generate-version.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$GITHUB_TAG" dist/* \
            --title "dogwood-py ${VERSION} build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build from ${GITHUB_SHA}." \
            $PRERELEASE_FLAG

  publish-pypi:
    name: Publish to PyPI
    needs: [generate-version, build-sdist, build-wheels]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
